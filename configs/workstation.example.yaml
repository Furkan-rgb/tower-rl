# Workstation template. Copy to configs/local.yaml and fill in host-specific values.
# Keep Play credentials, account state, snapshots, and generated artifacts out.
schema_version: 1

host:
  role: training_workstation
  os: pending_characterization
  architecture: pending_characterization
  gpu: NVIDIA RTX 4090
  memory_gib: 28

device:
  backend: adb
  serial: pending
  avd_name: tower_rl_api36_play_x86_64
  system_image: system-images;android-36;google_apis_playstore;x86_64
  renderer: pending_validation
  logical_size: [1080, 1920]
  density_dpi: 420
  locale: en-US

game:
  package: com.TechTreeGames.TheTower
  runtime_version: 29.0.3
  runtime_version_code: 1199
  baseline_id: tower-t1-initial-v1
  snapshot_name: pending_workstation_local_snapshot
  network_mode: offline_after_manual_play_provisioning

schemas:
  observation: observation-v1
  action: run-action-v1
