[project]
name = "tower-rl"
version = "0.1.0"
description = "Real-game reinforcement learning for Tier 1 of The Tower"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=11,<13",
    "torch>=2.14.0",
    "typer>=0.17,<1",
]

[project.scripts]
tower-rl = "tower_rl.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tower_rl"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# The device runners under scripts/ are checked too: a mistake there costs an
# hour of device time, which is the most expensive kind of mistake here.
mypy_path = "src:scripts"
files = ["src/tower_rl", "scripts"]
